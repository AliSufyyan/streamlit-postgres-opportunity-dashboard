# docker-compose.yml
# WHY: Defines all three services (Postgres, pgAdmin, Streamlit) so they
#      start together with one command. Docker Compose also creates a shared
#      internal network so services can reach each other by service name.

version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres_db:
    image: postgres:16         # official PostgreSQL image from Docker Hub
    container_name: opportunity_postgres
    environment:
      POSTGRES_DB:       student_opportunities_db
      POSTGRES_USER:     app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"                 # host:container port mapping
    volumes:
      - postgres_data:/var/lib/postgresql/data  # named volume = data persists even if container stops
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql       # runs on first start
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql  # runs on first start
    restart: unless-stopped         # restart automatically unless you manually stop it

  # ── pgAdmin (Database GUI) ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opportunity_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"                   # visit http://localhost:5050
    depends_on:
      - postgres_db                 # pgAdmin waits for postgres to start first
    restart: unless-stopped

  # ── Streamlit App ────────────────────────────────────────────────────────
  streamlit_app:
    build: .                        # build from our Dockerfile in the current directory
    container_name: opportunity_streamlit
    ports:
      - "8501:8501"
    environment:
      DB_HOST: postgres_db          # uses service name, not localhost (they share Docker network)
      DB_PORT: 5432
      DB_NAME: student_opportunities_db
      DB_USER: app_user
      DB_PASSWORD: app_password
    depends_on:
      - postgres_db
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:    # Docker manages this volume; data survives container restarts